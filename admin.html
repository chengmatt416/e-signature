<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Signature - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .login-section {
            display: block;
        }

        .login-section.hidden {
            display: none;
        }

        .admin-section {
            display: none;
        }

        .admin-section.show {
            display: block;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #fc4a1a;
        }

        .activation-code-display {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .activation-code-display.hidden {
            display: none;
        }

        .activation-code {
            font-family: 'Courier New', monospace;
            font-size: 2em;
            font-weight: bold;
            color: #fc4a1a;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .code-info {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .code-expiry {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary {
            background: #fc4a1a;
            color: white;
        }

        .btn-primary:hover {
            background: #e03d0f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 74, 26, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.show {
            display: block;
        }

        .codes-list {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .codes-list h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .code-item {
            background: white;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #fc4a1a;
        }

        .code-item:last-child {
            margin-bottom: 0;
        }

        .code-text {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #333;
        }

        .code-status {
            font-size: 0.85em;
            padding: 3px 8px;
            border-radius: 3px;
        }

        .code-status.active {
            background: #d4edda;
            color: #155724;
        }

        .code-status.used {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Panel</h1>
        <p class="subtitle">Activation Code Management</p>

        <div id="alert" class="alert"></div>

        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <div class="input-section">
                <label for="passcodeInput">Admin Passcode:</label>
                <input type="password" id="passcodeInput" placeholder="Enter admin passcode">
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="login()">Login</button>
                <button class="btn-secondary" onclick="goHome()">Back to Home</button>
            </div>
        </div>

        <!-- Admin Section -->
        <div id="adminSection" class="admin-section">
            <div id="codeDisplay" class="activation-code-display hidden">
                <h3>Generated Activation Code</h3>
                <div class="activation-code" id="generatedCode"></div>
                <div class="code-info">Share this code with users to allow them to create signatures</div>
                <div class="code-expiry">Valid for: <span id="codeExpiry">Unlimited use across all devices</span></div>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="generateActivationCode()">Generate New Code</button>
                <button class="btn-success" onclick="copyCode()">Copy Code</button>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </div>

            <div class="codes-list">
                <h3>Generated Codes History</h3>
                <div id="codesList"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const ADMIN_PASSCODE = '17808';
        const STORAGE_KEY = 'esig-activation-codes';
        const ACTIVATION_SECRET = 'e-signature-activation-secret-2024-v1'; // Secret for activation code encryption

        let isLoggedIn = false;
        let currentCode = null;

        // Encryption function for activation codes
        function encryptActivationCode(data, key) {
            const jsonStr = JSON.stringify(data);
            let encrypted = '';
            for (let i = 0; i < jsonStr.length; i++) {
                encrypted += String.fromCharCode(
                    jsonStr.charCodeAt(i) ^ key.charCodeAt(i % key.length)
                );
            }
            return btoa(encrypted); // Base64 encode
        }

        // Initialize
        function init() {
            // Check if there's a stored session
            const session = sessionStorage.getItem('esig-admin-session');
            if (session === 'active') {
                showAdminPanel();
                loadCodeHistory();
            }
        }

        // Login function
        function login() {
            const passcode = document.getElementById('passcodeInput').value.trim();
            
            if (passcode === '') {
                showAlert('Please enter the passcode', 'error');
                return;
            }

            if (passcode === ADMIN_PASSCODE) {
                isLoggedIn = true;
                sessionStorage.setItem('esig-admin-session', 'active');
                showAdminPanel();
                showAlert('Login successful!', 'success');
                loadCodeHistory();
            } else {
                showAlert('Incorrect passcode!', 'error');
                document.getElementById('passcodeInput').value = '';
            }
        }

        // Show admin panel
        function showAdminPanel() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('show');
            isLoggedIn = true;
        }

        // Logout function
        function logout() {
            isLoggedIn = false;
            sessionStorage.removeItem('esig-admin-session');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminSection').classList.remove('show');
            document.getElementById('passcodeInput').value = '';
            document.getElementById('codeDisplay').classList.add('hidden');
            showAlert('Logged out successfully', 'success');
        }

        // Go to home
        function goHome() {
            window.location.href = 'index.html';
        }

        // Generate activation code
        function generateActivationCode() {
            if (!isLoggedIn) {
                showAlert('You must be logged in to generate codes', 'error');
                return;
            }

            // Generate a cryptographic activation code that works cross-device
            const timestamp = Date.now();
            const random = Math.random().toString(36).substring(2, 15);
            const codeData = {
                timestamp: timestamp,
                random: random,
                valid: true
            };
            
            // Encrypt the code data
            const encryptedCode = encryptActivationCode(codeData, ACTIVATION_SECRET);
            
            // Create a readable code format
            const code = 'ESIG-' + encryptedCode.replace(/[+/=]/g, (c) => {
                return c === '+' ? 'A' : c === '/' ? 'B' : '';
            }).substring(0, 20);
            
            currentCode = code;

            // Display the code
            document.getElementById('generatedCode').textContent = code;
            document.getElementById('codeDisplay').classList.remove('hidden');

            // Save to history (for local display only)
            saveCodeToHistory(code);
            loadCodeHistory();

            showAlert('Activation code generated successfully! This code works on any device.', 'success');
        }

        // Copy code to clipboard
        function copyCode() {
            if (!currentCode) {
                showAlert('No code to copy. Generate a code first.', 'error');
                return;
            }

            navigator.clipboard.writeText(currentCode).then(() => {
                showAlert('Code copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback for older browsers
                const input = document.createElement('input');
                input.value = currentCode;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showAlert('Code copied to clipboard!', 'success');
            });
        }

        // Save code to history
        function saveCodeToHistory(code) {
            let codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            codes.unshift({
                code: code,
                generated: new Date().toISOString(),
                used: false
            });
            // Keep only last 50 codes
            codes = codes.slice(0, 50);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
        }

        // Load code history
        function loadCodeHistory() {
            const codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const codesList = document.getElementById('codesList');
            
            if (codes.length === 0) {
                codesList.innerHTML = '<div style="color: #999; text-align: center;">No codes generated yet</div>';
                return;
            }

            codesList.innerHTML = codes.map(item => `
                <div class="code-item">
                    <span class="code-text">${item.code}</span>
                    <span class="code-status ${item.used ? 'used' : 'active'}">${item.used ? 'Used' : 'Active'}</span>
                </div>
            `).join('');
        }

        // Mark code as used (called from sign.html via localStorage)
        window.markCodeAsUsed = function(code) {
            let codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const codeIndex = codes.findIndex(c => c.code === code);
            if (codeIndex !== -1) {
                codes[codeIndex].used = true;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
            }
        };

        // Check if code is valid - Note: This is now deprecated for cross-device codes
        // Validation happens in sign.html using cryptographic verification
        window.isValidActivationCode = function(code) {
            // For backward compatibility, check localStorage first
            const codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const foundCode = codes.find(c => c.code === code);
            return foundCode && !foundCode.used;
        };

        // Show alert
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type + ' show';
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Enter key support for login
        document.addEventListener('DOMContentLoaded', () => {
            init();
            
            document.getElementById('passcodeInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    login();
                }
            });
        });
    </script>
</body>
</html>
