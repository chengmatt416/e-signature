<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Signature - Admin Panel</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="E-Signature">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="72x72" href="icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#fc4a1a">
    

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .login-section.hidden { display: none; }
        .admin-section { display: none; }
        .admin-section.show { display: block; }
        .activation-code-display.hidden { display: none; }
        #alert { display: none; }
        #alert.show { display: block; }
    </style>

</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-700 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full text-center relative">
        <h1>🔐 Admin Panel</h1>
        <p class="subtitle">Activation Code Management</p>

        <div id="alert" class="alert"></div>

        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <div class="input-section">
                <label for="passcodeInput">Admin Passcode:</label>
                <input type="password" id="passcodeInput" class="w-full p-4 border-2 border-gray-200 rounded-xl focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all outline-none" placeholder="Enter admin passcode">
            </div>
            <div class="button-group">
                <button class="px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl transition-all w-full md:w-auto" onclick="login()">Login</button>
                <button class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white font-bold rounded-xl transition-all w-full md:w-auto" onclick="goHome()">Back to Home</button>
            </div>
        </div>

        <!-- Admin Section -->
        <div id="adminSection" class="admin-section">
            <div id="codeDisplay" class="activation-code-display hidden">
                <h3>Generated Activation Code</h3>
                <div class="activation-code" id="generatedCode"></div>
                <div class="code-info">Share this code with users to allow them to create signatures (works on any device)</div>
                <div class="code-expiry">Valid for: <span id="codeExpiry">30 days, single or multiple uses</span></div>
            </div>

            <div class="button-group">
                <button class="px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl transition-all w-full" onclick="generateActivationCode()">Generate New Code</button>
                <button class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl transition-all w-full" onclick="copyCode()">Copy Code</button>
                <button class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white font-bold rounded-xl transition-all w-full" onclick="logout()">Logout</button>
            </div>

            <div class="codes-list">
                <h3>Generated Codes History</h3>
                <div id="codesList"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const ADMIN_PASSCODE = '17808';
        const STORAGE_KEY = 'esig-activation-codes';

        let isLoggedIn = false;
        let currentCode = null;

        // Initialize
        function init() {
            // Check if there's a stored session
            const session = sessionStorage.getItem('esig-admin-session');
            if (session === 'active') {
                showAdminPanel();
                loadCodeHistory();
            }
        }

        // Login function
        function login() {
            const passcode = document.getElementById('passcodeInput').value.trim();
            
            if (passcode === '') {
                showAlert('Please enter the passcode', 'error');
                return;
            }

            if (passcode === ADMIN_PASSCODE) {
                isLoggedIn = true;
                sessionStorage.setItem('esig-admin-session', 'active');
                showAdminPanel();
                showAlert('Login successful!', 'success');
                loadCodeHistory();
            } else {
                showAlert('Incorrect passcode!', 'error');
                document.getElementById('passcodeInput').value = '';
            }
        }

        // Show admin panel
        function showAdminPanel() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('show');
            isLoggedIn = true;
        }

        // Logout function
        function logout() {
            isLoggedIn = false;
            sessionStorage.removeItem('esig-admin-session');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminSection').classList.remove('show');
            document.getElementById('passcodeInput').value = '';
            document.getElementById('codeDisplay').classList.add('hidden');
            showAlert('Logged out successfully', 'success');
        }

        // Go to home
        function goHome() {
            window.location.href = 'index.html';
        }

        // Simple hash function for code generation
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36).toUpperCase();
        }

        // Generate cryptographically signed activation code
        function generateActivationCode() {
            if (!isLoggedIn) {
                showAlert('You must be logged in to generate codes', 'error');
                return;
            }

            // Generate a unique activation code with embedded validation
            const timestamp = Date.now();
            const random = Math.random().toString(36).substring(2, 9).toUpperCase();
            
            // Create a secret that combines timestamp, random value, and admin passcode
            const secret = `${timestamp}:${random}:${ADMIN_PASSCODE}`;
            const signature = simpleHash(secret);
            
            // Format: AC-TIMESTAMP-RANDOM-SIGNATURE
            const code = `AC-${timestamp}-${random}-${signature}`;
            
            currentCode = code;

            // Display the code
            document.getElementById('generatedCode').textContent = code;
            document.getElementById('codeDisplay').classList.remove('hidden');

            // Save to history (still useful for tracking)
            saveCodeToHistory(code);
            loadCodeHistory();

            showAlert('Activation code generated successfully! This code can be used on any device.', 'success');
        }

        // Copy code to clipboard
        function copyCode() {
            if (!currentCode) {
                showAlert('No code to copy. Generate a code first.', 'error');
                return;
            }

            navigator.clipboard.writeText(currentCode).then(() => {
                showAlert('Code copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback for older browsers
                const input = document.createElement('input');
                input.value = currentCode;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showAlert('Code copied to clipboard!', 'success');
            });
        }

        // Save code to history
        function saveCodeToHistory(code) {
            let codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            codes.unshift({
                code: code,
                generated: new Date().toISOString(),
                used: false
            });
            // Keep only last 50 codes
            codes = codes.slice(0, 50);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
        }

        // Load code history
        function loadCodeHistory() {
            const codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const codesList = document.getElementById('codesList');
            
            if (codes.length === 0) {
                codesList.innerHTML = '<div style="color: #999; text-align: center;">No codes generated yet</div>';
                return;
            }

            codesList.innerHTML = codes.map(item => `
                <div class="bg-gray-50 p-4 rounded-lg flex justify-between items-center border-l-4 border-orange-500 mb-3 shadow-sm">
                    <span class="code-text">${item.code}</span>
                    <span class="code-status ${item.used ? 'used' : 'active'}">${item.used ? 'Used' : 'Active'}</span>
                </div>
            `).join('');
        }

        // Mark code as used (called from sign.html via localStorage)
        window.markCodeAsUsed = function(code) {
            let codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const codeIndex = codes.findIndex(c => c.code === code);
            if (codeIndex !== -1) {
                codes[codeIndex].used = true;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
            }
        };

        // Check if code is valid
        window.isValidActivationCode = function(code) {
            const codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const foundCode = codes.find(c => c.code === code);
            return foundCode && !foundCode.used;
        };

        // Show alert
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type + ' show';
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Enter key support for login
        document.addEventListener('DOMContentLoaded', () => {
            init();
            
            document.getElementById('passcodeInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    login();
                }
            });
        });
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch((err) => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
